services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./private_data:/app/private_data
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development

# Notes:
# - Postgres remains on the host. Ensure DATABASE_URL in .env uses host.docker.internal as the host
#   so containers can reach your local Postgres instance.
# - The old Streamlit service was removed. The new API serves endpoints under /api/* and the
#   frontend (Next.js) will be available on port 3000. During migration, Streamlit pages are
#   retained in the repo for reference but are no longer run by docker-compose.
# Example DATABASE_URL (in .env):
# DATABASE_URL=postgresql+psycopg://India_ITR_User:Nilh2399%24%40%231620@host.docker.internal:5432/India_ITR_Family
